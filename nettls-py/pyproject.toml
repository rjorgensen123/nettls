[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nettls-py"
description = "Python binding for nettls: pinned TLS, certificate rotation and the §6 messages, with the Rust code running inside."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "Roger Jorgensen", email = "rogerj@gmail.com" }]
readme = "README.md"
keywords = ["tls", "rustls", "pinning", "certificate", "rotation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security :: Cryptography",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/rjorgensen123/nettls"
Documentation = "https://github.com/rjorgensen123/nettls/blob/main/docs/Python.md"
Changelog = "https://github.com/rjorgensen123/nettls/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "nettls_py"

[tool.pytest.ini_options]
markers = ["slow: ring tests that start subprocesses and build the Rust node"]
