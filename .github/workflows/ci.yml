# CI for nettls on GitHub. Runs on every push to main and on pull requests.
#
# WHERE `krypto` COMES FROM. crates.io, as the manifest says — the same crate
# everyone else gets, so CI builds the checkout exactly as it is.
#
# The jobs run in a container rather than on the runner directly, for one reason:
# key material is held in `krypto`'s locked buffers, which mlock their pages and
# fail closed when they cannot. Each secret holds at least one whole locked page,
# and the test suite, running its tests in parallel, locks a little over 100 KiB
# at its peak. The test job sets the memlock limit to 1 MiB: enough with room to
# spare, and still a limit.
#
# Two things in this crate make a silent regression expensive, and the whole point
# of running CI is that the tests covering them actually get run:
#
#   1. THE PROVIDER TRAP. rustls fails CLOSED when zero or more than one crypto
#      provider is compiled in, and cargo features are additive — so a single new
#      dependency without `default-features = false` can pull a second provider in
#      through the back door. The symptom appears at the first handshake, which is
#      to say after rollout. The fence is a test in the crate, not a grep step
#      here, so it travels to everyone who builds it.
#
#   2. THE PYTHON SIDE (0.11.0). Python runs this same Rust code, through the binding
#      in `nettls-py`. There is one implementation, and CI checks that Python gets
#      all of it: the surface test, the vectors, the error corpus, the stream, and
#      the ring test of Python and Rust nodes over TLS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=1048576:1048576
    steps:
      - uses: actions/checkout@v7

      - name: Add clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Format check
        run: cargo fmt --all --check

      # `-D warnings`: a warning left standing becomes noise nobody reads, and a
      # local `cargo test` shows it as something you skim past.
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the provider fence and a real TLS handshake over a real TCP
      # socket — the right fingerprint gets through, the wrong one is stopped.
      - name: Test
        run: cargo test --locked --all-targets

      # --- The Python binding (0.11.0) ----------------------------------------- #
      #
      # `nettls-py` is this crate, run from Python through PyO3: one implementation,
      # two languages. CI builds the module and tests it from Python, under the same
      # memlock limit as the Rust tests.
      #
      # LOCKED, like the Rust side: nettls-py/requirements-ci.txt fixes maturin,
      # pytest and krypto-py with exact versions, transitives included.
      - name: Python + build tools (locked versions)
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip
          /tmp/venv/bin/pip install -q -r nettls-py/requirements-ci.txt

      - name: Clippy for nettls-py (warnings are errors)
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo clippy --locked -p nettls-py --all-targets -- -D warnings

      - name: Build and install nettls-py
        run: VIRTUAL_ENV=/tmp/venv /tmp/venv/bin/maturin develop --locked -m nettls-py/Cargo.toml

      # The Python API is the Rust API: the same names in the same places, both
      # ways, and a written reason for anything only one side has.
      - name: nettls-py surface
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo test --locked -p nettls-py

      # The vectors and the error corpus are normative. The stream carries TLS over
      # a Python socket. The ring (§6.15) has Python and Rust nodes rotating against
      # each other, with the error corpus injected mid-flight; the requirement is
      # that a hostile message is rejected, the state is unchanged, and the ring
      # keeps turning.
      - name: nettls-py from Python (pytest)
        run: /tmp/venv/bin/pytest nettls-py/tests -q

      # Finding a packaging problem here is cheap; finding it after a publish is
      # not, since a version number can never be reused.
      - name: Package check
        run: cargo package --locked

  # `rust-version` in Cargo.toml is the oldest Rust the crate promises to build
  # with, and the jobs above run on the newest stable. This job reads the version
  # from the manifest and builds every target with exactly that Rust, so the
  # promise is checked and the job never keeps its own copy of the number.
  msrv:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Build with the Rust named in rust-version
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v" || { echo "Cargo.toml names no rust-version" >&2; exit 1; }
          rustup toolchain install "$v" --profile minimal
          # The binding too. As an extension module on the stable ABI it needs no
          # Python to build, which is what these two variables tell PyO3.
          PYO3_NO_PYTHON=1 PYO3_BUILD_EXTENSION_MODULE=1 \
            cargo +"$v" check --workspace --all-targets --locked

  # Dependency audit: RustSec advisories, license allowlist, bans and source
  # control. The bans matter more here than in most crates — a second crypto
  # provider arriving through a transitive dependency is the failure this crate
  # exists to prevent. Configuration lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pinned binary rather than a third-party action. An action runs with
      # access to this repository and can change under its own tag; a release
      # artifact at a fixed version cannot.
      - name: Fetch cargo-deny
        run: |
          curl -sSfL -o /tmp/cd.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cd.tgz -C /tmp --strip-components=1
          install /tmp/cargo-deny /usr/local/bin/

      # `--workspace`: the binding's dependencies (PyO3) are audited too.
      - name: cargo deny check
        run: cargo deny --workspace check
