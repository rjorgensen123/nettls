# Gitea Actions CI for nettls (library).
# Runs on every push to main + pull requests.
#
# PREREQUISITE: a Gitea Actions runner must be registered.
#
# Why this crate needs CI (case L2-053): `nettls` was for a long time the ONLY published
# crate without it — 0.1.0 and 0.2.0 both went to Gitea without anything verifying them
# automatically. That is a bad trade for precisely this crate, which owns two things
# where a silent regression is expensive:
#
#   1. THE PROVIDER TRAP. rustls fail-CLOSES if zero or more than one crypto provider is
#      compiled in, and cargo features are additive — so one new dependency without
#      `default-features = false` can pull in aws-lc-rs through the back door. The
#      symptom appears only at the FIRST HANDSHAKE, i.e. typically after rollout. The
#      fence lives as a test (`tests/provider.rs::no_other_crypto_provider_in_cargo_lock`)
#      and not as a grep step here — deliberately, so it follows the crate to everyone
#      who builds it instead of living in one CI file someone can forget to copy. CI's
#      job is to make sure the tests actually RUN.
#   2. THE PYTHON SIDE (0.11.0). Python runs this same Rust code, through the binding in
#      `nettls-py`. Up to 0.10.0 it was a second implementation, `python/nettls.py`,
#      held to the first by cross-tests; now there is one implementation, and CI
#      checks that Python gets all of it: the surface test, the vectors, the error
#      corpus, the stream, and the ring test of Python and Rust nodes over TLS.
#
# KRYPTO (since 0.3.0): nettls consumes `krypto` from crates.io, as the manifest says.
# Up to 0.2.0 the crate was self-contained, and this file said so — right up until §6
# gave it a dependency on krypto's argon2id KDF and FAFN blob, by design. The comment
# about "no path deps" stayed after its premise broke, and CI failed on the first push.
#
# Lesson: a CI file that states a PREREQUISITE must be corrected in the same commit as
# the prerequisite changes. Otherwise it is not documentation, it is a trap.
#
# `--locked` guards Cargo.lock — and since the lockfile IS the test basis for the
# provider fence, it must be committed and correct.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    # krypto's locked buffers mlock their pages and fail closed when they cannot.
    # Each secret holds at least one whole locked page, and the test suite, running
    # its tests in parallel, locks a little over 100 KiB at its peak. 1 MiB is
    # enough with room to spare, and still a limit.
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=1048576:1048576
    steps:
      # Checkout without actions/checkout (which is fetched from github). Clone directly
      # from our own Gitea with the job token. rust:1-bookworm has git + base64.
      - name: Checkout (in-house — no github)
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf '%s' "x-access-token:${{ github.token }}" | base64 -w0)
          git -c http.extraheader="Authorization: basic ${AUTH}" \
              fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Add clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Format check
        run: cargo fmt --all --check

      # `-D warnings`: a warning allowed to stand becomes noise nobody reads. (Lesson
      # 2026-08-10: a test name in uppercase toppled a sibling crate's CI — a local
      # `cargo test` shows it only as a `warning:` you skim past.)
      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the provider fence and the real TLS handshake smoke test
      # (pin accept / pin reject over an actual TCP socket).
      - name: Test
        run: cargo test --locked --all-targets

      # --- The Python binding (0.11.0) ----------------------------------------- #
      #
      # `nettls-py` is this crate, run from Python through PyO3: one implementation,
      # two languages. CI builds the module and tests it from Python, under the same
      # memlock limit as the Rust tests.
      #
      # LOCKED, like the Rust side: nettls-py/requirements-ci.txt fixes maturin,
      # pytest and krypto-py with exact versions, transitives included.
      - name: Python + build tools (locked versions)
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip
          /tmp/venv/bin/pip install -q -r nettls-py/requirements-ci.txt

      - name: Clippy for nettls-py (warnings are errors)
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo clippy --locked -p nettls-py --all-targets -- -D warnings

      - name: Build and install nettls-py
        run: VIRTUAL_ENV=/tmp/venv /tmp/venv/bin/maturin develop --locked -m nettls-py/Cargo.toml

      # The Python API is the Rust API: the same names in the same places, both
      # ways, and a written reason for anything only one side has.
      - name: nettls-py surface
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo test --locked -p nettls-py

      # The vectors and the error corpus are normative. The stream carries TLS over
      # a Python socket. The ring (§6.15) has Python and Rust nodes rotating against
      # each other, with the error corpus injected mid-flight; the requirement is
      # that a hostile message is rejected, the state is unchanged, and the ring
      # keeps turning.
      - name: nettls-py from Python (pytest)
        run: /tmp/venv/bin/pytest nettls-py/tests -q

      # The crate is published to crates.io. Discovering a packaging problem here
      # is cheap; discovering it after a `cargo publish` is not — a version number
      # can never be reused. No `--allow-dirty`: nothing in CI edits the tree.
      - name: Package check (as before publishing)
        run: cargo package --locked

  # `rust-version` in Cargo.toml is the oldest Rust the crate promises to build
  # with, and the jobs above run on the newest stable. This job reads the version
  # from the manifest and builds every target with exactly that Rust, so the
  # promise is checked and the job never keeps its own copy of the number.
  msrv:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout (in-house — no github)
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf '%s' "x-access-token:${{ github.token }}" | base64 -w0)
          git -c http.extraheader="Authorization: basic ${AUTH}" \
              fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Build with the Rust named in rust-version
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v" || { echo "Cargo.toml names no rust-version" >&2; exit 1; }
          rustup toolchain install "$v" --profile minimal
          # The binding too. As an extension module on the stable ABI it needs no
          # Python to build, which is what these two variables tell PyO3.
          PYO3_NO_PYTHON=1 PYO3_BUILD_EXTENSION_MODULE=1 \
            cargo +"$v" check --workspace --all-targets --locked

  # Dependency audit (module round 0.8.2): RustSec advisories, license
  # allowlist, the aws-lc/rsa bans (the provider trap is this crate's whole
  # job) and source control — config in deny.toml.
  deny:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout (in-house — no github)
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf '%s' "x-access-token:${{ github.token }}" | base64 -w0)
          git -c http.extraheader="Authorization: basic ${AUTH}" \
              fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Fetch cargo-deny
        run: |
          curl -sSfL -o /tmp/cd.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cd.tgz -C /tmp --strip-components=1
          install /tmp/cargo-deny /usr/local/bin/

      # `--workspace`: the binding's dependencies (PyO3) are audited too.
      - name: cargo deny check
        run: cargo deny --workspace check
